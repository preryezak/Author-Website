<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- outer circle -->
  <circle cx="100" cy="100" r="96" stroke="#1E1A16" stroke-width="1.25"/>
  <!-- gold hairline ring -->
  <circle cx="100" cy="100" r="86" stroke="#B8925A" stroke-width="0.6"/>
  <!-- decorative dashed inner ring -->
  <circle cx="100" cy="100" r="80" stroke="#B8925A" stroke-width="0.4" stroke-dasharray="0.5 3"/>

  <!-- top ornament: cross flanked by dots -->
  <g transform="translate(100 22)">
    <circle cx="-14" cy="0" r="1.2" fill="#B8925A"/>
    <circle cx="14"  cy="0" r="1.2" fill="#B8925A"/>
    <path d="M0 -6 L0 6 M-4 0 L4 0" stroke="#B8925A" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- bottom ornament: fleuron trio -->
  <g transform="translate(100 182)" fill="#B8925A">
    <circle cx="-10" cy="-2" r="1"/>
    <circle cx="0"   cy="-2" r="1.4"/>
    <circle cx="10"  cy="-2" r="1"/>
  </g>

  <!-- ============================================
       E — three horizontals + spine (58 → 142 tall)
       ============================================ -->
  <g stroke="#1E1A16" stroke-linecap="square" fill="none">
    <path d="M58 58 L58 142" stroke-width="4"/>       <!-- E spine -->
    <path d="M58 58 L100 58" stroke-width="4"/>       <!-- top bar -->
    <path d="M58 100 L92 100" stroke-width="3"/>      <!-- middle bar (shorter) -->
    <path d="M58 142 L100 142" stroke-width="4"/>     <!-- bottom bar -->

    <!-- ============================================
         K — spine + two diagonals meeting at ONE vertex on the spine
         Vertex sits at (116, 100). No crossing = reads as K, not X.
         ============================================ -->
    <path d="M116 58 L116 142" stroke-width="4"/>     <!-- K spine -->
    <path d="M116 100 L150 58"  stroke-width="4"/>    <!-- upper leg → up-right -->
    <path d="M116 100 L150 142" stroke-width="4"/>    <!-- lower leg → down-right -->
  </g>

  <!-- oxblood pivot dot at the K's vertex — the visual "hinge" -->
  <circle cx="116" cy="100" r="2.6" fill="#7B3F2E"/>
</svg>
