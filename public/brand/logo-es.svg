<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- outer circle (ink) — matched to EK/EW -->
  <circle cx="100" cy="100" r="96" stroke="#1E1A16" stroke-width="1.25"/>
  <!-- gold hairline ring -->
  <circle cx="100" cy="100" r="86" stroke="#B8925A" stroke-width="0.6"/>
  <!-- dashed inner ring -->
  <circle cx="100" cy="100" r="80" stroke="#B8925A" stroke-width="0.4" stroke-dasharray="0.5 3"/>

  <!-- top ornament: three-bar rostrum (spoken word) -->
  <g transform="translate(100 22)" stroke="#B8925A" stroke-width="1" stroke-linecap="round">
    <line x1="-8" y1="0" x2="8" y2="0"/>
    <line x1="-5" y1="-3" x2="5" y2="-3"/>
    <line x1="-2" y1="-6" x2="2" y2="-6"/>
  </g>

  <!-- bottom ornament: dais bar (the lectern base) -->
  <g transform="translate(100 178)">
    <rect x="-16" y="0" width="32" height="1.4" fill="#B8925A"/>
    <rect x="-10" y="4" width="20" height="1" fill="#B8925A"/>
  </g>

  <!-- ============================================
       E — matched exactly to EK/EW construction
       ============================================ -->
  <g stroke="#1E1A16" stroke-linecap="square" fill="none">
    <path d="M52 58 L52 142" stroke-width="4"/>       <!-- E spine -->
    <path d="M52 58 L94 58"  stroke-width="4"/>       <!-- top bar -->
    <path d="M52 100 L86 100" stroke-width="3"/>      <!-- middle bar -->
    <path d="M52 142 L94 142" stroke-width="4"/>      <!-- bottom bar -->
  </g>

  <!-- ============================================
       S — set in Newsreader roman to match the E's contrast.
       Sized so its cap-height matches E (84px, y=58..142).
       ============================================ -->
  <text x="102" y="142"
        font-family="Newsreader, Georgia, serif"
        font-weight="500"
        font-size="122"
        letter-spacing="0"
        fill="#1E1A16">S</text>

  <!-- oxblood pivot dot at the S's baseline anchor — sibling signal to EK -->
  <circle cx="154" cy="142" r="2.8" fill="#7B3F2E"/>
</svg>
