# Cloudflare Worker with Static Assets — eryezakalalu.com author site.
#
# The Worker name is deliberately `ccndaily-books`: that is the existing production
# Worker which holds the custom domains `eryezakalalu.com` and
# `www.eryezakalalu.com` (verified via the Cloudflare API:
#   GET /accounts/<id>/workers/domains -> service `ccndaily-books`).
# Deploying under this name replaces the live site while keeping the domain
# bindings, so no DNS or dashboard change is required.
#
# The superseded Vite project shipped the same mechanism on `archive/old-vite-site`:
#     name = "ccndaily-books"
#     [assets]
#     directory = "./dist/public"
#
# `npm run build` produces `dist/public` (the Next.js static export is mirrored
# there by scripts/postbuild.mjs). Deploy with:
#
#     npm install
#     npm run build
#     npx wrangler deploy

name = "ccndaily-books"
compatibility_date = "2026-08-19"

# Edge Worker (edge/worker.ts). It runs only for the paths in `run_worker_first`
# below; every other request is served straight from static assets as before.
main = "edge/worker.ts"

[assets]
directory = "./dist/public"
binding = "ASSETS"
# Only these paths invoke the Worker (HTTP Range for the film, visitor region).
run_worker_first = ["/video/*", "/api/geo"]
# Real 404s.
#
# This was "single-page-application", which returned HTTP 200 with the
# homepage HTML for ANY unmatched path. That made /about, /books, /give and
# every other missing route look like a success to browsers, crawlers and link
# checkers, while showing the wrong page to a visitor.
#
# The site now ships real route pages plus a designed 404.html (src/app/not-found.tsx),
# so unmatched paths are served that page with a genuine 404 status.
not_found_handling = "404-page"
