# Worker `eryeza-checkout`: on-site purchase, payment check and book delivery.
# Needs Workers Paid (PDF stamping uses more CPU than the free plan allows).
# Deploy from the repo root:
#   npx wrangler deploy -c worker/checkout.wrangler.toml
# Full setup: worker/README.md ("Checkout Worker").

name = "eryeza-checkout"
main = "checkout.ts"
compatibility_date = "2026-08-19"

# Same-origin routes in front of the `ccndaily-books` site Worker.
routes = [
  { pattern = "eryezakalalu.com/api/checkout*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/order*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/flw/*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/admin/*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/dl/*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/give*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/give*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/lead*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/api/find-day", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/find-day", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/lead*", zone_name = "eryezakalalu.com" },
  { pattern = "eryezakalalu.com/free/*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/free/*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/checkout*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/order*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/dl/*", zone_name = "eryezakalalu.com" },
]

# Re-check unpaid orders every 30 minutes (closed tabs, late mobile money, missed webhooks).
[triggers]
crons = ["*/30 * * * *"]

# PDF stamping of a 200-page book can take a few seconds of CPU.
[limits]
cpu_ms = 60000

# Workers AI: text embeddings for "Find your day" (no generated text).
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
SITE = "https://eryezakalalu.com"
MAIL_FROM = "Eryeza Kalalu <books@eryezakalalu.com>"
REPLY_TO = "books@eryezakalalu.com"
NOTIFY_EMAIL = "pastor.eryeza@gmail.com"
NOTIFY_FROM = "speaking@eryezakalalu.com"
REFUND_DAYS = "14"
GUARANTEE = "0"
# Public values (safe in code). Fill in before launch:
FLW_PUBLIC_KEY = ""
META_PIXEL_ID = ""
META_GRAPH_VERSION = "v24.0"
BEEHIIV_PUB_ID = "pub_c9f06833-61ef-4c33-a6ef-b571a5fd3304"
TEST_MODE = "1"

# Secrets (typed by Eryeza, never committed):
#   npx wrangler secret put FLW_SECRET_KEY   -c worker/checkout.wrangler.toml
#   npx wrangler secret put FLW_SECRET_HASH  -c worker/checkout.wrangler.toml
#   npx wrangler secret put RESEND_API_KEY   -c worker/checkout.wrangler.toml
#   npx wrangler secret put ADMIN_KEY        -c worker/checkout.wrangler.toml   (any long random phrase)
#   npx wrangler secret put IP_SALT          -c worker/checkout.wrangler.toml   (any random phrase)
#   npx wrangler secret put META_CAPI_TOKEN  -c worker/checkout.wrangler.toml   (Events Manager > Settings > Conversions API)
#   npx wrangler secret put BEEHIIV_API_KEY  -c worker/checkout.wrangler.toml

[[d1_databases]]
binding = "DB"
database_name = "eryeza-orders"
database_id = "REPLACE_AFTER_d1_create"

# Private bucket: book files, audio, and stamped copies under orders/. Never public.
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "eryeza-books"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["speaking@eryezakalalu.com"]
allowed_destination_addresses = ["pastor.eryeza@gmail.com"]
