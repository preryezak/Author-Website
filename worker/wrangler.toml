name = "eryeza-speaking"
main = "speaking.ts"
compatibility_date = "2024-12-01"

# ── Public vars ─────────────────────────────────────────────────────
[vars]
# The inbox that receives every speaking invitation.
SPEAKING_EMAIL = "speaking@eryezakalalu.com"
# Native Email Service sender. Must be an address on a domain you have
# onboarded to Cloudflare Email Service (eryezakalalu.com).
EMAIL_FROM = "speaking@eryezakalalu.com"
# The inbox that receives submissions. This must be a VERIFIED destination
# address in Email Routing; the send_email binding refuses anything else.
# Verified destination on this account: pastor.eryeza@gmail.com
NOTIFY_EMAIL = "pastor.eryeza@gmail.com"
# Used only on the Resend fallback path. Until eryezakalalu.com is verified
# on Resend, mail sends from Resend's shared onboarding address.
RESEND_FROM = "onboarding@resend.dev"
ALLOWED_ORIGIN = "https://eryezakalalu.com"

# ── D1 storage (LIVE) ───────────────────────────────────────────────
# Created 2026-09-22. The Worker stores every submission here BEFORE attempting
# to email, so a mail outage never loses an invitation.
#   Query submissions:
#     wrangler d1 execute eryeza-speaking-db --remote \
#       --command "SELECT createdAt, name, email, status FROM speaking_requests ORDER BY createdAt DESC LIMIT 20"
[[d1_databases]]
binding = "DB"
database_name = "eryeza-speaking-db"
database_id = "d1ba4007-adb8-4965-8213-3af2c475c321"

# ── Email path 1 (preferred): NATIVE Cloudflare Email Service ───────
# ENABLED 2026-09-27.
#
# The old warning here said that turning this on asks Cloudflare to manage the
# domain's MX records, and that it would divert mail handled elsewhere. That
# concern was checked and does not apply: eryezakalalu.com already runs on
# Cloudflare Email Routing. Verified via the API on 2026-09-27:
#   - Email Routing enabled, status "ready"
#   - MX -> route1/2/3.mx.cloudflare.net
#   - DKIM published at cf2024-1._domainkey, SPF includes _spf.mx.cloudflare.net
#   - forwarding rules for speaking@, media@, books@, hello@ -> pastor.eryeza@gmail.com
#   - verified destination address: pastor.eryeza@gmail.com
# So this binding is additive. It does not change MX records or routing.
#
# NOTE on the addresses: allowed_destination_addresses must list a VERIFIED
# destination address, which is pastor.eryeza@gmail.com. speaking@eryezakalalu.com
# is a routing rule (an address on the domain), not a destination, so the earlier
# draft of this block had the wrong value.
#
# Sending to a verified destination address is free on every plan, including
# Workers Free. Sending to arbitrary recipients needs Workers Paid.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["speaking@eryezakalalu.com"]
allowed_destination_addresses = ["pastor.eryeza@gmail.com"]


# ── Email path 2 (fallback): Resend ─────────────────────────────────
# Used automatically only when the native EMAIL binding above is absent.
# RESEND_API_KEY -> run:  wrangler secret put RESEND_API_KEY
# (Never commit the key; it is stored encrypted in Cloudflare.)

# ── Optional custom route ───────────────────────────────────────────
# To serve the Worker at eryezakalalu.com/worker/speaking (same origin, so no
# CORS at all), add a route in the Cloudflare dashboard, then set
#   NEXT_PUBLIC_SPEAKING_ENDPOINT = https://eryezakalalu.com/worker/speaking
# on the site. Until then the site uses the workers.dev URL.
