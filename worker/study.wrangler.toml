# Worker `eryeza-study`: free weekly study-guide sign-up (Kit + optional Beehiiv).
# Deploy from the repo root:
#   npx wrangler deploy -c worker/study.wrangler.toml
# Full setup: worker/README.md ("Study guide Worker").

name = "eryeza-study"
main = "study.ts"
compatibility_date = "2026-08-19"

# Same-origin endpoint. A Worker route runs in front of the `ccndaily-books`
# custom-domain Worker, so /api/study is answered here and every other path
# still goes to the site.
routes = [
  { pattern = "eryezakalalu.com/api/study*", zone_name = "eryezakalalu.com" },
  { pattern = "www.eryezakalalu.com/api/study*", zone_name = "eryezakalalu.com" },
]

[vars]
ALLOWED_ORIGIN = "https://eryezakalalu.com,https://www.eryezakalalu.com"
# The guide: a Kit form whose confirmation email delivers it. Kit free plan has
# no API, so the Worker submits to the form's public subscribe address.
# NEEDS-OWNER: the number from the form's address in Kit.
KIT_FORM_ID = ""
# Only used on a paid Kit plan with KIT_API_KEY set: optional tag ids. Left
# empty, the Worker finds-or-creates "study-guide" / "letter-optin" / "week-N".
KIT_TAG_STUDY = ""
KIT_TAG_LETTER = ""
# Beehiiv (free Launch plan; API included once Stripe identity verification is done).
# Eryeza Writes, the letter (supplied by Eryeza 1 Oct 2026). Not a secret.
BEEHIIV_PUB_ID = "pub_c9f06833-61ef-4c33-a6ef-b571a5fd3304"
# Optional, paid Beehiiv only (free plan = one publication): a separate Study
# Guide publication that would replace Kit. Leave empty; Kit (above) is used.
BEEHIIV_STUDY_PUB_ID = ""

# Secrets (never committed):
#   npx wrangler secret put BEEHIIV_API_KEY -c worker/study.wrangler.toml
#   npx wrangler secret put KIT_API_KEY -c worker/study.wrangler.toml   # only if Kit is upgraded to a paid plan

# D1: created with
#   npx wrangler d1 create eryeza-study-db
# then paste the database_id below and load worker/study-schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "eryeza-study-db"
database_id = "REPLACE_WITH_D1_ID"
